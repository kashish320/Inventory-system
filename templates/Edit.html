<!DOCTYPE html>
<html>
<head>
<title>Edit Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>Edit Product</h2>

<form action="/update/{{ p.id }}" method="POST">
<input name="name" value="{{ p.name }}" class="form-control mb-2">
<input name="sp" value="{{ p.sp }}" class="form-control mb-2">
<input name="cp" value="{{ p.cp }}" class="form-control mb-2">
<input name="quantity" value="{{ p.quantity }}" class="form-control mb-2">
<input name="sales" value="{{ p.sales }}" class="form-control mb-2">
<button class="btn btn-success">Update</button>
</form>

</body>
</html>
